<!doctype html>
<html lang="my">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Pirchchat — Dashboard</title>
<meta name="description" content="A Burmese-language community dashboard. Map of incidents, live news, chat rooms.">
<link rel="stylesheet" href="dashboard.css">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@400;500&family=IBM+Plex+Sans:wght@400;500;700&family=IBM+Plex+Serif:ital,wght@0,400;0,700;1,400;1,700&family=Noto+Sans+Myanmar:wght@400;500;700&display=swap" rel="stylesheet">
<link href="https://unpkg.com/maplibre-gl@4.7.1/dist/maplibre-gl.css" rel="stylesheet">
<script src="https://unpkg.com/maplibre-gl@4.7.1/dist/maplibre-gl.js"></script>
</head>
<body class="win95 full-bleed">

<div class="dash">

  <!-- ===== LEFT PANE: MAP DASHBOARD ===== -->
  <aside class="dash__left" aria-label="Map dashboard">

    <div class="titlebar">
      <span class="titlebar__dot" aria-hidden="true"></span>
      <span class="titlebar__title">Pirchchat — Map</span>
      <span class="titlebar__spacer"></span>
      <button class="titlebar__btn" type="button" aria-label="Minimize" title="Minimize">_</button>
      <button class="titlebar__btn" type="button" aria-label="Maximize" title="Maximize" id="mapMax">▢</button>
      <button class="titlebar__btn titlebar__btn--close" type="button" aria-label="Close">×</button>
    </div>

    <nav class="menubar" aria-label="Map menu">
      <button type="button" class="menubar__item"><u>F</u>ile</button>
      <button type="button" class="menubar__item"><u>V</u>iew</button>
      <button type="button" class="menubar__item"><u>L</u>ayers</button>
      <button type="button" class="menubar__item"><u>T</u>ools</button>
      <button type="button" class="menubar__item" onclick="window.location='index.html'"><u>H</u>ome</button>
    </nav>

    <div class="toolbar" role="toolbar" aria-label="Map toolbar">
      <button type="button" class="toolbar__btn" data-layer="satellite" title="Satellite imagery">▢ Satellite</button>
      <button type="button" class="toolbar__btn" data-layer="streets" title="Streets">▤ Streets</button>
      <button type="button" class="toolbar__btn" data-layer="dark" title="Dark vector">▣ Dark</button>
      <button type="button" class="toolbar__btn" data-layer="light" title="Light vector">▦ Light</button>
      <span class="toolbar__sep"></span>
      <button type="button" class="toolbar__btn" data-action="fit" title="Fit all incidents">⌖ Fit</button>
      <button type="button" class="toolbar__btn" data-action="news-only" title="Show news only">● News</button>
      <button type="button" class="toolbar__btn" data-action="chat-only" title="Show chat mentions only">● Chat</button>
      <button type="button" class="toolbar__btn" data-action="all" title="Show all">●● All</button>
      <span class="toolbar__sep"></span>
      <button type="button" class="toolbar__btn" data-action="add" title="Add a pin manually">＋ Pin</button>
    </div>

    <div class="linkbar">
      <span class="linkbar__label" id="mapCoord">lat 16.78 · lng 96.16 · zoom 5</span>
      <span class="linkbar__sep">·</span>
      <span class="linkbar__lat" id="mapIncCount">0 incidents</span>
    </div>

    <div class="map-wrapper">
      <div id="map" role="application" aria-label="Map"></div>
      <div class="map-legend">
        <span class="legend__dot legend__dot--news" aria-hidden="true"></span><span>News</span>
        <span class="legend__dot legend__dot--chat" aria-hidden="true"></span><span>Chat mention</span>
        <span class="legend__dot legend__dot--you" aria-hidden="true"></span><span>You pinned</span>
      </div>
    </div>

    <div class="statusbar" aria-label="Map status bar">
      <span class="statusbar__item"><span class="led led--on" aria-hidden="true"></span><span id="mapStatus">Map: Esri imagery · Asia</span></span>
      <span class="statusbar__spacer"></span>
      <span class="statusbar__item">MapLibre GL 4.7 · Esri World Imagery</span>
    </div>
  </aside>

  <!-- ===== RIGHT PANE: NEWS + CHAT ===== -->
  <section class="dash__right" aria-label="News and chat">

    <!-- News pane -->
    <section class="news" aria-labelledby="news-h">
      <div class="titlebar">
        <span class="titlebar__dot" aria-hidden="true"></span>
        <span class="titlebar__title">News — Myanmar &amp; diaspora</span>
        <span class="titlebar__spacer"></span>
        <span class="titlebar__meta" id="newsClock">00:00 ICT</span>
      </div>
      <nav class="menubar">
        <button type="button" class="menubar__item menubar__item--active" data-news-filter="all"><u>A</u>ll</button>
        <button type="button" class="menubar__item" data-news-filter="mm"><u>M</u>yanmar (MM)</button>
        <button type="button" class="menubar__item" data-news-filter="diaspora">Diaspora (TH)</button>
        <button type="button" class="menubar__item" data-news-filter="asean">ASEAN</button>
        <button type="button" class="menubar__item" data-news-filter="world">W<u>orld</u></button>
      </nav>
      <div class="news__list" id="newsList" aria-live="polite" aria-label="Live news list"></div>
      <div class="statusbar">
        <span class="statusbar__item"><span class="led led--on" aria-hidden="true"></span><span id="newsCount">0 items</span></span>
        <span class="statusbar__spacer"></span>
        <span class="statusbar__item">Refreshed <span id="newsAgo">just now</span></span>
      </div>
    </section>

    <!-- Chat pane -->
    <section class="chat" aria-labelledby="chat-h">
      <div class="titlebar">
        <span class="titlebar__dot" aria-hidden="true"></span>
        <span class="titlebar__title">Chat — <span id="chatRoomTitle">#monastic-youth</span></span>
        <span class="titlebar__spacer"></span>
        <span class="titlebar__meta" id="chatUserLabel">guest@pirchchat</span>
      </div>
      <nav class="menubar" role="tablist" aria-label="Rooms">
        <button type="button" class="menubar__item menubar__item--active" data-room="monastic-youth"><u>M</u>onastic-youth</button>
        <button type="button" class="menubar__item" data-room="bkk-burmese"><u>B</u>kk-burmese</button>
        <button type="button" class="menubar__item" data-room="cm-burmese">Cm-burm<u>e</u>se</button>
        <button type="button" class="menubar__item" data-room="digest-today">Diges<u>t</u>-today</button>
        <button type="button" class="menubar__item" data-room="listening-club">L<u>i</u>stening-club</button>
      </nav>

      <div class="chat__body">
        <section class="messages" id="messages" aria-label="Messages" aria-live="polite"></section>
        <aside class="members" aria-label="Members">
          <header class="members__head">Members</header>
          <ul class="members__list" id="memberList"></ul>
        </aside>
      </div>

      <form class="composer" id="composer" autocomplete="off">
        <input type="text" name="msg" id="input" class="composer__input" placeholder="Type a message in Burmese or English…  URLs become preview cards" aria-label="Message">
        <button type="submit" class="composer__send">Send</button>
      </form>
    </section>

  </section>

</div>

<div class="modal" id="modal" hidden>
  <div class="modal__panel">
    <div class="titlebar">
      <span class="titlebar__dot" aria-hidden="true"></span>
      <span class="titlebar__title" id="modalTitle">Incident</span>
      <span class="titlebar__spacer"></span>
      <button class="titlebar__btn titlebar__btn--close" type="button" id="modalClose">×</button>
    </div>
    <div class="modal__body" id="modalBody"></div>
  </div>
</div>

<script src="dashboard.js"></script>
</body>
</html>
