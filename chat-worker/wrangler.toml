name = "pirchchat-chat"
main = "src/index.js"
compatibility_date = "2025-09-01"
compatibility_flags = ["web_socket_auto_reply_to_close"]

# Daily digest auto-post — 23:00 UTC = 06:00 ICT, into #digest-today.
[triggers]
crons = ["0 23 * * *"]

[observability.logs]
enabled = true

# Upload spend guards. R2 has no hard account spend cap, so the worker
# enforces these before it stores an image. A day is midnight to midnight
# in Asia/Bangkok. GLOBAL_DAILY_CAP = "0" refuses new uploads.
# MAX_UPLOAD_BYTES above 2 MiB is ignored and the 700 KiB default is used.
[vars]
RATE_LIMIT_PER_MINUTE = "6"
RATE_LIMIT_PER_DAY = "20"
GLOBAL_DAILY_CAP = "100"
MAX_UPLOAD_BYTES = "716800"
ALLOWED_ORIGINS = "https://burma.nonarkara.org,https://burma-a3k.pages.dev,http://127.0.0.1:8798,http://localhost:8798"

# D1 — message archive + identity table + rooms + members + uploads + pins
[[d1_databases]]
binding = "DB"
database_name = "pirchchat"
database_id = "2f3d42a4-ba2b-4b18-bbfb-f6f251979d8d"

# R2 — image attachments (with public CDN)
[[r2_buckets]]
binding = "UPLOADS"
bucket_name = "pirchchat-uploads"

# Durable Objects — one ChatRoomDO per room + one RateLimiterDO for uploads
[[durable_objects.bindings]]
name = "CHAT_ROOM"
class_name = "ChatRoomDO"

[[durable_objects.bindings]]
name = "RATE_LIMITER"
class_name = "RateLimiterDO"

[[migrations]]
tag = "v1"
new_sqlite_classes = ["ChatRoomDO"]

[[migrations]]
tag = "v2"
new_sqlite_classes = ["RateLimiterDO"]
